name: Build resume outputs

on:
  push:
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate resume.json and brand.json
        run: npm run validate:data

      - name: Build site
        run: npm run build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render PDF
        run: npm run build:pdf
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}

      - name: Render DOCX
        run: npm run build:docx

      - name: Render Markdown
        run: npm run build:md

      - name: Render LinkedIn TXT
        run: npm run build:txt

      - name: Compute release tag
        id: tag
        run: echo "tag=v-$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish outputs as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            output/resume.pdf
            output/resume.docx
            output/resume.md
            output/linkedin.txt
